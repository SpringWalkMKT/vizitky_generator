name: Generovani vizitek

on:
  workflow_dispatch:
  push:
    paths:
      - "osoby.tsv"
      - "generuj_vizitku.py"
      - "sablona_vizitka.pdf"
      - "requirements.txt"
      - "fonts/**"
      - "tests/**"
      - ".github/workflows/vizitky.yml"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalace zavislosti
        run: pip install -r requirements.txt

      - name: Kontrola tiskove sazby
        run: python -m unittest discover -s tests -v

      - name: Generovani vizitek
        run: python generuj_vizitku.py --tsv osoby.tsv

      - name: Ulozeni vysledku
        uses: actions/upload-artifact@v6
        with:
          name: vizitky-pdf
          path: output/*.pdf
          if-no-files-found: error
